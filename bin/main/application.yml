spring:
  application:
    name: cde-msa-sp-openai-documentation
app:
  git:
    base-url: ${CDE_GIT_BASE_URL:https://dev.azure.com}
    username: ${CDE_GIT_USERNAME:}
    personal-access-token: ${CDE_GIT_PAT:}
    clone-directory: ${CDE_GIT_CLONE_DIRECTORY:${user.home}/Documents/repositorios de agentes}
    overwrite-existing: ${CDE_GIT_OVERWRITE_EXISTING:false}
  temporal:
    enabled: ${CDE_TEMPORAL_ENABLED:false}
    namespace: ${CDE_TEMPORAL_NAMESPACE:default}
    task-queue: ${CDE_TEMPORAL_TASK_QUEUE:repository-agent-task-queue}
    server-target: ${CDE_TEMPORAL_SERVER_TARGET:127.0.0.1:7233}
    workflow-timeout: ${CDE_TEMPORAL_WORKFLOW_TIMEOUT:PT30M}
    workflow-id-prefix: ${CDE_TEMPORAL_WORKFLOW_ID_PREFIX:repository-agent}

documentation:
  output-directory: ${CDE_DOCUMENTATION_OUTPUT_DIRECTORY:docs}
  overwrite-existing: ${CDE_DOCUMENTATION_OVERWRITE_EXISTING:true}
  evolutionary-mode: ${CDE_DOCUMENTATION_EVOLUTIONARY_MODE:true}

github:
  copilot:
    command: ${CDE_GITHUB_COPILOT_COMMAND:copilot}
    arguments: ${CDE_GITHUB_COPILOT_ARGUMENTS:-p}
    timeout-seconds: ${CDE_GITHUB_COPILOT_TIMEOUT_SECONDS:300}
server:
  port: 8080 
management:
  endpoints:
    web:
      exposure:
        include: ${CDE_ACTUATOR_ENDPOINTS_INCLUDE:health}
      base-path: ${CDE_ACTUATOR_BASE_PATH:/actuator}
  endpoint:
    health:
      probes:
        enabled: ${CDE_ACTUATOR_HEALTH_PROBES_ENABLED:true}
      show-details: ${CDE_ACTUATOR_HEALTH_SHOW_DETAILS:never}
      show-components: ${CDE_ACTUATOR_HEALTH_SHOW_COMPONENTS:never}
      group:
        liveness:
          include: ${CDE_ACTUATOR_HEALTH_LIVENESS_INCLUDE:livenessState}
          show-details: ${CDE_ACTUATOR_HEALTH_LIVENESS_SHOW_DETAILS:never}
        readiness:
          include: ${CDE_ACTUATOR_HEALTH_READINESS_INCLUDE:readinessState,diskSpace}
          show-details: ${CDE_ACTUATOR_HEALTH_READINESS_SHOW_DETAILS:never}
  health:
    livenessState:
      enabled: ${CDE_ACTUATOR_HEALTH_LIVENESS_ENABLED:true}
    readinessState:
      enabled: ${CDE_ACTUATOR_HEALTH_READINESS_ENABLED:true}

logging:
  level:
    root: ${CDE_LOGGING_ROOT:INFO}

trace-logger:
  enabled: ${CDE_TRACE_LOGGER_ENABLED:true}
  custom-level:
    enabled: ${CDE_CUSTOM_LEVEL_ENABLED:true}
    infoEnabled: ${CDE_INFO_ENABLED:true}
    debugEnabled: ${CDE_DEBUG_ENABLED:true}
    warnEnabled: ${CDE_WARN_ENABLED:true}
    errorEnabled: ${CDE_ERROR_ENABLED:true}